<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400">

  <!-- Globe outline -->
  <circle cx="280" cy="128" r="112" fill="none" stroke="#1a2d5a" stroke-width="2.5"/>

  <!-- Latitude grid lines -->
  <ellipse cx="280" cy="128" rx="112" ry="56" fill="none" stroke="#1a2d5a" stroke-width="1" opacity="0.35"/>
  <ellipse cx="280" cy="128" rx="112" ry="25" fill="none" stroke="#1a2d5a" stroke-width="1" opacity="0.22"/>
  <!-- Equator -->
  <line x1="168" y1="128" x2="392" y2="128" stroke="#1a2d5a" stroke-width="1" opacity="0.35"/>
  <!-- Prime meridian -->
  <line x1="280" y1="16" x2="280" y2="240" stroke="#1a2d5a" stroke-width="1" opacity="0.22"/>
  <!-- Additional meridians (curved) -->
  <path d="M 228 18 Q 204 72 204 128 Q 204 184 228 238" fill="none" stroke="#1a2d5a" stroke-width="1" opacity="0.18"/>
  <path d="M 332 18 Q 356 72 356 128 Q 356 184 332 238" fill="none" stroke="#1a2d5a" stroke-width="1" opacity="0.18"/>

  <!-- North America -->
  <path d="M 174 70 Q 185 60 200 64 Q 215 57 226 70 Q 234 81 231 97 Q 228 114 217 122 Q 205 130 191 125 Q 177 129 169 117 Q 161 106 162 91 Q 162 79 174 70 Z" fill="#1a2d5a"/>
  <!-- Greenland -->
  <path d="M 218 22 Q 228 16 237 22 Q 242 30 236 37 Q 228 42 220 37 Q 215 30 218 22 Z" fill="#1a2d5a"/>
  <!-- South America -->
  <path d="M 179 136 Q 194 129 207 138 Q 216 148 215 165 Q 213 181 206 193 Q 197 204 186 203 Q 174 202 167 190 Q 160 176 162 160 Q 164 146 179 136 Z" fill="#1a2d5a"/>
  <!-- Europe -->
  <path d="M 272 66 Q 285 60 296 67 Q 305 74 304 86 Q 302 97 291 101 Q 281 104 272 97 Q 264 90 265 78 Q 266 70 272 66 Z" fill="#1a2d5a"/>
  <!-- Africa -->
  <path d="M 270 107 Q 284 101 297 109 Q 308 118 308 135 Q 308 154 300 167 Q 292 180 279 181 Q 266 181 258 169 Q 250 156 251 137 Q 252 118 262 111 Q 266 107 270 107 Z" fill="#1a2d5a"/>

  <!-- Red swoosh arc -->
  <path d="M 172 225 Q 224 196 282 209 Q 342 223 402 182" fill="none" stroke="#c0271e" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Plane at tip of swoosh -->
  <g transform="translate(400,178) rotate(-38)">
    <polygon points="0,0 24,-5 22,0 24,5" fill="#1a2d5a"/>
    <polygon points="7,0 16,-13 18,-11 10,0" fill="#1a2d5a"/>
    <polygon points="2,0 5,-7 7,-6 4,0" fill="#1a2d5a"/>
  </g>

  <!-- REACT lettering -->
  <text x="22" y="316"
        font-family="'Arial Black', 'Arial Bold', Helvetica, sans-serif"
        font-weight="900" font-size="128" fill="#1a2d5a" letter-spacing="5">REACT</text>

  <!-- ECG / heartbeat line (sits at baseline of REACT, between A and C) -->
  <polyline
    points="190,320 208,320 214,300 222,342 230,296 238,320 310,320"
    fill="none" stroke="#c0271e" stroke-width="3.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Subtitle row 1: — RAPID EMERGENCY AEROCARE TEAM — -->
  <line x1="22"  y1="347" x2="118" y2="347" stroke="#1a2d5a" stroke-width="1.8"/>
  <text x="280" y="351" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13.5" fill="#1a2d5a" letter-spacing="3">RAPID <tspan font-weight="700" fill="#c0271e">EMERGENCY</tspan> AEROCARE TEAM</text>
  <line x1="442" y1="347" x2="538" y2="347" stroke="#1a2d5a" stroke-width="1.8"/>

  <!-- Subtitle row 2: — AIR AMBULANCE — -->
  <line x1="22"  y1="374" x2="150" y2="374" stroke="#1a2d5a" stroke-width="1.8"/>
  <text x="280" y="378" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13.5" fill="#1a2d5a" letter-spacing="5">AIR AMBULANCE</text>
  <line x1="410" y1="374" x2="538" y2="374" stroke="#1a2d5a" stroke-width="1.8"/>

</svg>
